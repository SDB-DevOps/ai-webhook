# Default values for ai-webhook.

replicaCount: 1

image:
  repository: docker.io/digo66/kagent-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 8000
  targetPort: 8000
  nodePort: 30168

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 100Mi
  limits:
    cpu: 200m
    memory: 256Mi
    ephemeral-storage: 1Gi

probes:
  liveness:
    path: /api/hello
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /api/hello
    initialDelaySeconds: 2
    periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
