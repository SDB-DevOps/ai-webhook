apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-webhook.fullname" . | quote }}
  labels:
    {{- include "ai-webhook.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | quote }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ai-webhook.selectorLabels" . | nindent 4 }}


